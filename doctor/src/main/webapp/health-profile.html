<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健康档案 - 智慧医疗系统</title>
    <style>
        :root {
            --bg: #f3f7fc;
            --card: #ffffff;
            --text: #1c2f4d;
            --muted: #5f7494;
            --border: #d7e3f3;
            --primary: #2b78d6;
            --success: #1b8f46;
            --warn: #d65b00;
        }

        * { box-sizing: border-box; }

        body.med-tech-page {
            color: var(--text);
            min-height: 100vh;
            position: relative;
        }

        body.med-tech-page .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .brand h1 {
            margin: 0;
            font-size: 24px;
            color: #223656;
        }

        .brand p {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 13px;
        }

        .nav-buttons {
            display: flex;
            gap: 12px;
        }

        .nav-btn {
            padding: 10px 20px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background: #1f65b8;
            transform: translateY(-1px);
        }

        .nav-btn.secondary {
            background: #f3f4f6;
            color: #374151;
        }

        .nav-btn.secondary:hover {
            background: #e5e7eb;
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2b78d6, #1f65b8);
            display: grid;
            place-items: center;
            color: #fff;
            font-size: 32px;
            font-weight: 700;
        }

        .profile-info h2 {
            margin: 0 0 8px;
            font-size: 24px;
            color: #223656;
        }

        .profile-info .tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tag {
            padding: 4px 12px;
            background: #e9faf7;
            color: #009688;
            border-radius: 20px;
            font-size: 12px;
        }

        .health-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .health-item {
            background: #f8fbff;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            border: 1px solid #dbe8f7;
        }

        .health-item .value {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .health-item .label {
            font-size: 13px;
            color: var(--muted);
        }

        .health-item .unit {
            font-size: 14px;
            color: var(--muted);
            margin-left: 4px;
        }

        .chart-section {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .chart-section h3 {
            margin: 0 0 20px;
            font-size: 20px;
            color: #223656;
        }

        #radar-chart {
            width: 100%;
            height: 400px;
        }

        .bmi-status {
            margin-top: 20px;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
        }

        .bmi-status.normal {
            background: #effcf3;
            border: 1px solid #bde6c7;
        }

        .bmi-status.underweight {
            background: #eff6ff;
            border: 1px solid #ddd6fe;
        }

        .bmi-status.overweight {
            background: #fff7f1;
            border: 1px solid #ffd4b8;
        }

        .bmi-status.obese {
            background: #fef2f2;
            border: 1px solid #fecaca;
        }

        .bmi-status h4 {
            margin: 0 0 8px;
            font-size: 16px;
        }

        .bmi-status.normal h4 { color: #1b8f46; }
        .bmi-status.underweight h4 { color: #7c3aed; }
        .bmi-status.overweight h4 { color: #d65b00; }
        .bmi-status.obese h4 { color: #dc2626; }

        .bmi-status p {
            margin: 0;
            font-size: 14px;
            color: #374151;
        }

        .data-section {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 24px;
            margin-top: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .data-section h3 {
            margin: 0 0 20px;
            font-size: 20px;
            color: #223656;
        }

        .data-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .data-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 16px;
            background: #f8fbff;
            border-radius: 10px;
        }

        .data-item label {
            color: var(--muted);
            font-size: 14px;
        }

        .data-item .value-text {
            font-weight: 600;
            color: #223656;
        }

        @media (max-width: 968px) {
            .health-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .data-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 640px) {
            .health-grid {
                grid-template-columns: 1fr;
            }
            .topbar {
                flex-direction: column;
                gap: 12px;
            }
        }
    </style>
    <link rel="stylesheet" href="css/med-tech.css?v=layout1">
    <link rel="stylesheet" href="css/med-tech-pages.css?v=layout1">
    <link rel="stylesheet" href="css/med-tech-secondary.css?v=layout3">
</head>
<body class="med-tech-page">
    <div class="container">
        <div class="topbar">
            <div class="brand">
                <h1 class="nav-active">健康档案</h1>
                <p>全面了解您的健康状况</p>
            </div>
            <div class="nav-buttons">
                <button class="nav-btn secondary" id="edit-btn">编辑信息</button>
                <button class="nav-btn" id="back-btn">返回首页</button>
            </div>
        </div>

        <div class="profile-card">
            <div class="profile-header">
                <div class="avatar" id="avatar">患</div>
                <div class="profile-info">
                    <h2 id="patient-name">患者</h2>
                    <div class="tags" id="tags"></div>
                </div>
            </div>

            <div class="health-grid">
                <div class="health-item">
                    <div class="value" id="val-bp">--</div>
                    <div class="label">血压 <span class="unit">mmHg</span></div>
                </div>
                <div class="health-item">
                    <div class="value" id="val-bs">--</div>
                    <div class="label">血糖 <span class="unit">mmol/L</span></div>
                </div>
                <div class="health-item">
                    <div class="value" id="val-bmi">--</div>
                    <div class="label">BMI指数</div>
                </div>
                <div class="health-item">
                    <div class="value" id="val-age">--</div>
                    <div class="label">年龄 <span class="unit">岁</span></div>
                </div>
            </div>
        </div>

        <div class="chart-section">
            <h3>健康指标雷达图</h3>
            <div id="radar-chart"></div>
            
            <div class="bmi-status" id="bmi-status">
                <h4>BMI状态评估</h4>
                <p>请完善身高体重数据以获取BMI评估</p>
            </div>
        </div>

        <div class="data-section">
            <h3>基本信息</h3>
            <div class="data-grid">
                <div class="data-item">
                    <label>性别</label>
                    <span class="value-text" id="info-gender">--</span>
                </div>
                <div class="data-item">
                    <label>年龄</label>
                    <span class="value-text" id="info-age">--</span>
                </div>
                <div class="data-item">
                    <label>手机号</label>
                    <span class="value-text" id="info-phone">--</span>
                </div>
                <div class="data-item">
                    <label>婚姻状况</label>
                    <span class="value-text" id="info-marriage">--</span>
                </div>
                <div class="data-item">
                    <label>身份证号</label>
                    <span class="value-text" id="info-idcard">--</span>
                </div>
                <div class="data-item">
                    <label>地址</label>
                    <span class="value-text" id="info-address">--</span>
                </div>
                <div class="data-item">
                    <label>既往病史</label>
                    <span class="value-text" id="info-history">无</span>
                </div>
                <div class="data-item">
                    <label>过敏史</label>
                    <span class="value-text" id="info-allergy">无</span>
                </div>
            </div>
        </div>
    </div>

    <script src="js/echarts.min.js"></script>
    <script>
        const $ = (id) => document.getElementById(id);

        const urlParams = new URLSearchParams(window.location.search);
        let userId = urlParams.get('userId');
        if (!userId) userId = sessionStorage.getItem('patientUserId');
        let userName = urlParams.get('userName');
        if (!userName) userName = sessionStorage.getItem('patientUserName');

        console.log('Health Profile - userId:', userId);
        console.log('Health Profile - userName:', userName);

        if (userName) {
            $("patient-name").textContent = userName;
            $("avatar").textContent = (userName.charAt(0) || '患').toUpperCase();
        }

        const getBmiStatus = (bmi) => {
            if (bmi < 18.5) return { status: 'underweight', label: '偏瘦', desc: '您的体重偏低，建议适当增加营养摄入，保持均衡饮食。' };
            if (bmi < 24) return { status: 'normal', label: '正常', desc: '恭喜！您的体重在健康范围内，请继续保持健康的生活方式。' };
            if (bmi < 28) return { status: 'overweight', label: '偏胖', desc: '您的体重略高于标准，建议适当增加运动量，注意饮食控制。' };
            return { status: 'obese', label: '肥胖', desc: '您的体重超标较多，建议咨询医生制定科学的减重计划。' };
        };

        const initRadarChart = (data) => {
            const chart = echarts.init($('radar-chart'));

            const bloodPressure = data.bloodPressure || 0;
            const bloodSugar = data.bloodSugar || 0;
            const height = data.height || 0;
            const weight = data.weight || 0;
            const age = data.age || 0;
            
            let bmi = 0;
            if (height > 0 && weight > 0) {
                bmi = weight / Math.pow(height / 100, 2);
                bmi = Math.round(bmi * 100) / 100;
            }

            // 各维度得分：越接近理想值越高（满分 100）
            // 血压理想值 120 mmHg（有效范围 60–200）
            // 血糖理想值 5.0 mmol/L（有效范围 2.8–11.1）
            // BMI 理想值 22（健康带约 18.5–28）
            // 年龄状态：年龄越大分越低（每岁扣 0.5 分，封顶 100）
            const bpNormal = 120;
            const bsNormal = 5.0;
            
            const bpScore = bloodPressure > 0 ? calculateHealthScore(bloodPressure, bpNormal, 60, 200) : 0;
            const bsScore = bloodSugar > 0 ? calculateHealthScore(bloodSugar, bsNormal, 2.8, 11.1) : 0;
            const bmiScore = bmi > 0 ? calculateHealthScore(bmi, 22, 18.5, 28) : 0;
            const ageScore = age > 0 ? Math.min(100, Math.max(0, 100 - age * 0.5)) : 0;

            // 标准参考：各维度满分参考环（统一 100，不再用 25 岁推算出的 87.5）
            const stdBpScore = 100;
            const stdBsScore = 100;
            const stdBmiScore = 100;
            const stdAgeScore = 100;
            const stdHealthScore = 100;

            const option = {
                backgroundColor: 'transparent',
                textStyle: { color: '#f0f4f8' },
                tooltip: {
                    trigger: 'item',
                    backgroundColor: 'rgba(10,16,32,0.92)',
                    borderColor: 'rgba(78,205,196,0.35)',
                    textStyle: { color: '#f0f4f8' }
                },
                legend: {
                    data: ['健康指标', '标准参考'],
                    bottom: 10,
                    textStyle: { color: 'rgba(240,244,248,0.7)' }
                },
                radar: {
                    indicator: [
                        { name: '血压', max: 100 },
                        { name: '血糖', max: 100 },
                        { name: 'BMI指数', max: 100 },
                        { name: '年龄状态', max: 100 },
                        { name: '健康评估', max: 100 }
                    ],
                    center: ['50%', '50%'],
                    radius: '60%',
                    axisName: { color: '#7ee8e0' },
                    splitArea: {
                        areaStyle: {
                            color: ['rgba(78,205,196,0.02)', 'rgba(78,205,196,0.06)', 'rgba(44,123,229,0.04)', 'rgba(44,123,229,0.08)']
                        }
                    },
                    axisLine: { lineStyle: { color: 'rgba(78,205,196,0.25)' } },
                    splitLine: { lineStyle: { color: 'rgba(78,205,196,0.2)' } }
                },
                series: [{
                    type: 'radar',
                    data: [{
                        value: [bpScore, bsScore, bmiScore, ageScore, Math.round((bpScore + bsScore + bmiScore + ageScore) / 4)],
                        name: '健康指标',
                        areaStyle: {
                            color: 'rgba(78, 205, 196, 0.28)'
                        },
                        lineStyle: {
                            color: '#4ecdc4',
                            width: 2
                        },
                        itemStyle: {
                            color: '#4ecdc4'
                        }
                    }, {
                        value: [stdBpScore, stdBsScore, stdBmiScore, stdAgeScore, stdHealthScore],
                        name: '标准参考',
                        areaStyle: {
                            color: 'rgba(255, 99, 99, 0.1)'
                        },
                        lineStyle: {
                            color: '#ff6363',
                            width: 2,
                            type: 'dashed'
                        },
                        itemStyle: {
                            color: '#ff6363'
                        }
                    }]
                }]
            };

            chart.setOption(option);

            window.addEventListener('resize', () => {
                chart.resize();
            });

            return bmi;
        };

        const calculateHealthScore = (value, normalValue, minValue, maxValue) => {
            if (value < minValue || value > maxValue) {
                return 0;
            }
            const distance = Math.abs(value - normalValue);
            const maxDistance = Math.max(normalValue - minValue, maxValue - normalValue);
            const score = Math.max(0, 100 - (distance / maxDistance) * 100);
            return Math.round(score);
        };

        const loadPatientData = async () => {
            if (!userId) {
                console.error('loadPatientData - userId is null or empty');
                return;
            }
            
            try {
                console.log('loadPatientData - fetching data for userId:', userId);
                const url = `/doctor/patientInfo/queryByUserId?userId=${encodeURIComponent(userId)}`;
                console.log('loadPatientData - fetch URL:', url);
                
                const response = await fetch(url, {
                    credentials: 'include'
                });
                
                console.log('loadPatientData - response status:', response.status);
                
                const res = await response.json();
                console.log('loadPatientData - response data:', JSON.stringify(res, null, 2));

                if (res.code === 1 && res.content) {
                    const patient = res.content;
                    console.log('loadPatientData - patient data:', JSON.stringify(patient, null, 2));
                    
                    $("val-bp").textContent = patient.bloodPressure || '--';
                    $("val-bs").textContent = patient.bloodSugar || '--';
                    $("val-age").textContent = patient.age || '--';
                    $("info-age").textContent = patient.age || '--';
                    $("info-gender").textContent = patient.gender === '1' ? '男' : patient.gender === '0' ? '女' : '--';
                    $("info-phone").textContent = patient.phone || '--';
                    $("info-marriage").textContent = patient.marriage || '--';
                    $("info-idcard").textContent = patient.idCard || '--';
                    $("info-address").textContent = patient.address || '--';
                    $("info-history").textContent = patient.history || '无';
                    $("info-allergy").textContent = patient.allergy || '无';

                    const genderText = patient.gender === '1' ? '男' : patient.gender === '0' ? '女' : '未知';
                    $("tags").innerHTML = `<span class="tag">${genderText}</span><span class="tag">${patient.age || '未知'}岁</span>`;

                    const bmi = initRadarChart(patient);
                    
                    if (bmi > 0) {
                        $("val-bmi").textContent = bmi;
                        const bmiInfo = getBmiStatus(bmi);
                        const statusEl = $("bmi-status");
                        statusEl.className = `bmi-status ${bmiInfo.status}`;
                        statusEl.innerHTML = `<h4>BMI状态：${bmiInfo.label}</h4><p>${bmiInfo.desc}</p>`;
                    }
                } else {
                    console.log('loadPatientData - no patient data found or response error');
                    console.log('loadPatientData - res.code:', res.code);
                    console.log('loadPatientData - res.content:', res.content);
                }
            } catch (error) {
                console.error('loadPatientData - error:', error);
            }
        };

        $("back-btn").addEventListener("click", () => {
            window.location.href = `patient-dashboard.html?userId=${encodeURIComponent(userId)}&userName=${encodeURIComponent(userName)}`;
        });

        $("edit-btn").addEventListener("click", () => {
            window.location.href = `patient-info.html?userId=${encodeURIComponent(userId)}&userName=${encodeURIComponent(userName)}`;
        });

        loadPatientData();
    </script>
</body>
</html>
