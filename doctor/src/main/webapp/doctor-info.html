<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>完善医生信息 - 医疗系统</title>
    <style>
        :root {
            --primary-color: #ff7043;
            --success-color: #1b8f46;
            --warning-color: #d65b00;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #ff7043 0%, #ff5722 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .form-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .form-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .form-header h1 {
            margin: 0 0 8px;
            font-size: 28px;
            color: #223656;
        }

        .form-header p {
            margin: 0;
            color: #6b7280;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #374151;
            font-weight: 500;
        }

        .form-group label .required {
            color: #ef4444;
            margin-left: 4px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s ease;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--primary-color);
        }

        .form-group textarea {
            resize: none;
            height: 100px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 32px;
        }

        .btn {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff7043, #ff5722);
            color: #fff;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 112, 67, 0.4);
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
        }

        .result {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
            display: none;
        }

        .result.success {
            display: block;
            background: #effcf3;
            border: 1px solid #bde6c7;
            color: #1b8f46;
        }

        .result.error {
            display: block;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
        }

        .info-tip {
            background: #fff7f1;
            border: 1px solid #ffd4b8;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-tip span {
            color: #c2410c;
            font-size: 13px;
        }

        .select-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .select-group label {
            margin-bottom: 0;
        }

        @media (max-width: 640px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .form-card {
                padding: 24px;
            }
        }
    </style>
    <link rel="stylesheet" href="css/med-tech.css?v=layout1">
    <link rel="stylesheet" href="css/med-tech-pages.css?v=layout1">
    <link rel="stylesheet" href="css/med-tech-secondary.css?v=layout3">
</head>
<body class="med-tech-page">
    <div class="form-card">
        <div class="form-header">
            <h1 class="nav-active">完善医生信息</h1>
            <p>请填写您的专业信息，以便患者更好地了解您</p>
        </div>

        <div class="info-tip">
            <span>💡 请确保信息真实有效，审核通过后可正式接诊</span>
        </div>

        <form id="doctor-form">
            <div class="form-row">
                <div class="form-group">
                    <label>姓名 <span class="required">*</span></label>
                    <input type="text" id="doctor-name" required>
                </div>
                <div class="form-group">
                    <label>性别 <span class="required">*</span></label>
                    <select id="doctor-gender" required>
                        <option value="">请选择</option>
                        <option value="1">男</option>
                        <option value="0">女</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>年龄</label>
                    <input type="number" id="doctor-age" min="18" max="100">
                </div>
                <div class="form-group">
                    <label>手机号</label>
                    <input type="tel" id="doctor-phone">
                </div>
            </div>

            <div class="form-group">
                <label>科室分类 <span class="required">*</span></label>
                <select id="doctor-dept-group" required>
                    <option value="">请选择科室分类</option>
                    <option value="综合科室">综合科室</option>
                    <option value="内科系统">内科系统</option>
                    <option value="外科系统">外科系统</option>
                    <option value="妇产科">妇产科</option>
                    <option value="儿科">儿科</option>
                    <option value="专科科室">专科科室</option>
                    <option value="医技科室">医技科室</option>
                    <option value="中医康复">中医康复</option>
                    <option value="其他">其他</option>
                </select>
            </div>

            <div class="form-group">
                <label>具体科室 <span class="required">*</span></label>
                <select id="doctor-dept" required>
                    <option value="">请先选择科室分类</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>职称</label>
                    <select id="doctor-title">
                        <option value="">请选择职称</option>
                        <option value="主任医师">主任医师</option>
                        <option value="副主任医师">副主任医师</option>
                        <option value="主治医师">主治医师</option>
                        <option value="住院医师">住院医师</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>学历</label>
                    <select id="doctor-education">
                        <option value="">请选择学历</option>
                        <option value="中专">中专</option>
                        <option value="大专">大专</option>
                        <option value="本科">本科</option>
                        <option value="硕士">硕士</option>
                        <option value="博士">博士</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>专业特长</label>
                <textarea id="doctor-specialty" placeholder="请描述您的专业特长，如：冠心病介入治疗、胃肠镜检查等"></textarea>
            </div>

            <div class="form-group">
                <label>个人简介</label>
                <textarea id="doctor-intro" placeholder="请简要介绍您的从医经历和成就"></textarea>
            </div>

            <div class="btn-group">
                <button type="button" class="btn btn-secondary" id="skip-btn">稍后填写</button>
                <button type="submit" class="btn btn-primary">保存信息</button>
            </div>

            <div class="result" id="result"></div>
        </form>
    </div>

    <script>
        const $ = (id) => document.getElementById(id);

        const userId = new URLSearchParams(window.location.search).get('userId');
        const userName = new URLSearchParams(window.location.search).get('userName');

        const deptGroups = {
            '综合科室': ['全科医学科'],
            '内科系统': ['内科', '心血管内科', '呼吸内科', '消化内科', '肾内科', '内分泌科', '风湿免疫科', '血液内科', '感染科', '神经内科'],
            '外科系统': ['外科', '神经外科', '心胸外科', '泌尿外科', '肝胆外科', '胃肠外科', '乳腺外科', '血管外科', '烧伤整形外科', '肛肠科', '骨科'],
            '妇产科': ['妇产科', '妇科', '产科', '新生儿科'],
            '儿科': ['儿科', '儿童保健科'],
            '专科科室': ['眼科', '耳鼻喉科', '口腔科', '皮肤科', '男科', '肿瘤科', '老年病科', '过敏反应科'],
            '医技科室': ['急诊科', '重症医学科ICU', '麻醉科', '手术室', '检验科', '放射科', '超声科', '心电图室', '病理科', '药剂科', '消毒供应中心'],
            '中医康复': ['中医科', '针灸推拿科', '康复医学科'],
            '其他': ['营养科', '体检中心']
        };

        $("doctor-dept-group").addEventListener("change", () => {
            const group = $("doctor-dept-group").value;
            const deptSelect = $("doctor-dept");
            
            deptSelect.innerHTML = '';
            
            if (!group) {
                deptSelect.innerHTML = '<option value="">请先选择科室分类</option>';
                return;
            }
            
            const depts = deptGroups[group] || [];
            deptSelect.innerHTML = '<option value="">请选择具体科室</option>' + 
                depts.map(dept => `<option value="${dept}">${dept}</option>`).join('');
        });

        if (userName) {
            $("doctor-name").value = userName;
        }

        $("doctor-form").addEventListener("submit", async (e) => {
            e.preventDefault();

            const payload = {
                userId: userId,
                doctorName: $("doctor-name").value.trim(),
                gender: $("doctor-gender").value,
                age: $("doctor-age").value,
                phone: $("doctor-phone").value.trim(),
                dept: $("doctor-dept").value,
                title: $("doctor-title").value,
                education: $("doctor-education").value,
                specialty: $("doctor-specialty").value.trim(),
                intro: $("doctor-intro").value.trim(),
                status: 1
            };

            try {
                const res = await fetch('/doctor/doctorInfo/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                    credentials: 'include'
                }).then(r => r.json());

                const result = $("result");
                if (res.code === 1) {
                    result.className = "result success";
                    result.textContent = "信息保存成功！正在跳转...";
                    setTimeout(() => {
                        window.location.href = `doctor-dashboard.html?userId=${encodeURIComponent(userId)}&userName=${encodeURIComponent(payload.doctorName)}`;
                    }, 1500);
                } else {
                    result.className = "result error";
                    result.textContent = res.msg || "保存失败，请稍后重试";
                }
            } catch (error) {
                const result = $("result");
                result.className = "result error";
                result.textContent = "网络错误，请稍后重试";
            }
        });

        $("skip-btn").addEventListener("click", () => {
            window.location.href = `doctor-dashboard.html?userId=${encodeURIComponent(userId)}&userName=${encodeURIComponent(userName || '医生')}`;
        });
    </script>
</body>
</html>
